name: windows-ci

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 云端 Windows 编译（WinUI3 Release x64 自包含）
        run: >
          dotnet publish src/TaoDBM/TaoDBM.csproj -c Release -r win-x64
          --self-contained true -p:WindowsAppSDKSelfContained=true -p:Platform=x64
          --nologo -v q

      - name: 逻辑全测（四层+万链）
        run: dotnet run --project logictest/logictest.csproj -c Release --nologo
